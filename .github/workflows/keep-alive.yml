name: Keep Supabase awake

# A Free Supabase project is paused after a week without enough database
# activity. This calls keep_alive() (see supabase/migrations/0006_hardening.sql)
# every three days.
#
# One-time setup: in the GitHub repo go to Settings -> Secrets and variables ->
# Actions and add two repository secrets:
#   SUPABASE_URL        https://YOUR-PROJECT-REF.supabase.co
#   SUPABASE_ANON_KEY   the publishable key (sb_publishable_...), not the secret key
#
# GitHub switches off scheduled workflows in a repo that has had no activity
# for 60 days. Push any commit, or press "Run workflow" below, to keep it going.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."
            exit 1
          fi
          status=$(curl -s -o response.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}')
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "Ping failed with HTTP $status"
            exit 1
          fi
